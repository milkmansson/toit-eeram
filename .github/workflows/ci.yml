name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: toitlang/action-setup@v1
        with:
          toit-version: 'v2.0.0-alpha.199'

      - name: Analyze
        shell: bash
        run: |
          # toit analyze takes one source file at a time.
          status=0
          for file in src/*.toit tests/*.toit examples/*.toit; do
            echo "Analyzing $file"
            toit analyze "$file" || status=1
          done
          exit $status

      # The mock tests are not run in CI for now.  Run them locally with
      # `make test`, or add a step like this:
      #
      # - name: Test
      #   shell: bash
      #   run: |
      #     make rebuild-cmake
      #     make test
